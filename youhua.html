async function processDigitalEsign() {
    const L = uiLocales[currentLang];
    const total = selectedFiles.length;
    showProgress(L.processing);

    for (let i = 0; i < total; i++) {
        const file = selectedFiles[i];
        const pct = 5 + ((i / total) * 90);
        setProgress(pct, `签章处理 ${file.name} (${i+1}/${total})`);

        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'pdf') {
            // PDF e-sign: add signature annotation
            const buf = await readFileAsArrayBuffer(file);
            const pdfDoc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
            const pages = pdfDoc.getPages();
            const firstPage = pages[0];
            const { width, height } = firstPage.getSize();

            // Draw signature stamp
            firstPage.drawRectangle({ x: width - 150, y: 50, width: 120, height: 60, color: PDFLib.rgb(1,1,1), borderColor: PDFLib.rgb(0.2,0.6,0.9), borderWidth: 2 });
            firstPage.drawText('DIGITALLY SIGNED', { x: width - 140, y: 80, size: 9, color: PDFLib.rgb(0.2,0.6,0.9) });
            firstPage.drawText(new Date().toLocaleDateString(), { x: width - 140, y: 65, size: 8, color: PDFLib.rgb(0.5,0.5,0.5) });

            const bytes = await pdfDoc.save();
            const blob = new Blob([bytes], { type: 'application/pdf' });
            download(blob, getBaseName(file.name) + '_signed.pdf', 'application/pdf');
        } else if (ext === 'docx') {
            // DOCX e-sign: add metadata
            const buf = await readFileAsArrayBuffer(file);
            const zip = await JSZip.loadAsync(buf);
            zip.file('litepdf_esign.json', JSON.stringify({
                signedAt: new Date().toISOString(),
                method: 'LitePDF Digital E-Sign',
                notice: 'This document has been electronically signed'
            }));
            const outBuf = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
            const blob = new Blob([outBuf], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
            download(blob, getBaseName(file.name) + '_signed.docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        } else if (['png', 'jpg', 'jpeg'].includes(ext)) {
            // Image e-sign: overlay stamp on canvas
            const dataUrl = await readFileAsDataURL(file);
            const img = await loadImage(dataUrl);
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // Draw signature stamp
            ctx.strokeStyle = '#3182ce';
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width - 200, canvas.height - 100, 180, 80);
            ctx.fillStyle = '#3182ce';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('DIGITALLY SIGNED', canvas.width - 190, canvas.height - 60);
            ctx.fillStyle = '#718096';
            ctx.font = '12px sans-serif';
            ctx.fillText(new Date().toLocaleDateString(), canvas.width - 190, canvas.height - 40);

            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            download(blob, getBaseName(file.name) + '_signed.png', 'image/png');
        }
    }

    setProgress(100, L.done);
    showToast(currentLang === 'zh' ? `签章完成！已处理 ${total} 个文件` : `E-Sign complete! ${total} file(s) processed`, 'success');
}

// ========================================================
// PPTX PARSING HELPERS (using JSZip)
// ========================================================

// EMU → pixels. Standard slide: 1 inch = 914400 EMU, 1 cm = 360000 EMU
const PPTX_SLIDE_DEFAULTS = { cx: 12192000, cy: 6858000 }; // 16:9

function parseSlideSize(presXml) {
    const m = presXml.match(/<p:sldSz[^>]*\/>/);
    if (!m) return PPTX_SLIDE_DEFAULTS;
    const cx = m[0].match(/cx="(\d+)"/), cy = m[0].match(/cy="(\d+)"/);
    return { cx: cx ? parseInt(cx[1]) : 12192000, cy: cy ? parseInt(cy[1]) : 6858000 };
}

function parsePptxColor(val) {
    if (!val) return null;
    if (val.length === 8) val = val.substring(2);
    return '#' + val.toUpperCase();
}

// Scheme color defaults (standard Office theme)
const SCHEME_COLORS = {
    'tx1': '#000000', 'tx2': '#44546A',
    'bg1': '#FFFFFF', 'bg2': '#F2F2F2',
    'accent1': '#4472C4', 'accent2': '#ED7D31', 'accent3': '#A5A5A5',
    'accent4': '#FFC000', 'accent5': '#5B9BD5', 'accent6': '#70AD47',
    'dk1': '#000000', 'dk2': '#44546A',
    'lt1': '#FFFFFF', 'lt2': '#F2F2F2',
    'hlink': '#0563C1', 'folHlink': '#954F72'
};

// Resolve any color: srgbClr, schemeClr, or srgbClr with alpha
function resolveColor(clrXml) {
    if (!clrXml) return null;
    // srgbClr
    const srgb = clrXml.match(/<a:srgbClr val="([^"]+)"/);
    if (srgb) {
        let c = parsePptxColor(srgb[1]);
        // Check for alpha inside srgbClr
        const alpha = clrXml.match(/<a:alpha val="(\d+)"/);
        if (alpha && c) {
            const a = parseInt(alpha[1]) / 100000; // alpha is in 1/1000 %
            if (a < 1) c = applyAlpha(c, a);
        }
        return c;
    }
    // schemeClr
    const sch = clrXml.match(/<a:schemeClr val="([^"]+)"/);
    if (sch) {
        let c = SCHEME_COLORS[sch[1]] || '#333333';
        const alpha = clrXml.match(/<a:alpha val="(\d+)"/);
        if (alpha) {
            const a = parseInt(alpha[1]) / 100000;
            if (a < 1) c = applyAlpha(c, a);
        }
        // lumMod / lumOff: brightness adjustments
        const lumMod = clrXml.match(/<a:lumMod val="(\d+)"/);
        if (lumMod) {
            const factor = parseInt(lumMod[1]) / 100000;
            c = adjustBrightness(c, factor);
        }
        const lumOff = clrXml.match(/<a:lumOff val="(\d+)"/);
        if (lumOff) {
            const offset = parseInt(lumOff[1]) / 100000;
            c = adjustBrightness(c, 1 + offset);
        }
        return c;
    }
    // prstClr (preset color, e.g. "black")
    const prst = clrXml.match(/<a:prstClr val="([^"]+)"/);
    if (prst) {
        const presetMap = { 'black': '#000000', 'white': '#FFFFFF', 'red': '#FF0000', 'green': '#00FF00', 'blue': '#0000FF' };
        return presetMap[prst[1].toLowerCase()] || '#000000';
    }
    return null;
}

function applyAlpha(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + Math.round(alpha * 100) / 100 + ')';
}

function adjustBrightness(hex, factor) {
    // Only works with simple # hex colors, returns same format
    if (!hex || hex.length !== 7) return hex;
    const r = Math.min(255, Math.round(parseInt(hex.slice(1, 3), 16) * factor));
    const g = Math.min(255, Math.round(parseInt(hex.slice(3, 5), 16) * factor));
    const b = Math.min(255, Math.round(parseInt(hex.slice(5, 7), 16) * factor));
    return '#' + r.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + b.toString(16).padStart(2, '0');
}

function emuToPx(emu, scale) { return Math.round(emu * scale); }

// ── Shape parser ──
function parseShapeElement(spXml) {
    const s = { type: 'shape', name: '', x: 0, y: 0, w: 100, h: 50, fill: null, stroke: null, texts: [], geom: 'rect', rot: 0, flipH: false, flipV: false, anchor: 't', imgFillId: null };
    const nm = spXml.match(/<p:cNvPr[^>]*name="([^"]*)"/); if (nm) s.name = nm[1];
    const off = spXml.match(/<a:off[^>]*x="(\d+)"[^>]*y="(\d+)"/); if (off) { s.x = parseInt(off[1]); s.y = parseInt(off[2]); }
    const ext = spXml.match(/<a:ext[^>]*cx="(\d+)"[^>]*cy="(\d+)"/); if (ext) { s.w = parseInt(ext[1]); s.h = parseInt(ext[2]); }
    const pr = spXml.match(/<a:prstGeom prst="([^"]+)"/); if (pr) s.geom = pr[1];
    // Rotation & flip
    const rt = spXml.match(/rot="(\d+)"/); if (rt) s.rot = parseInt(rt[1]) / 60000;  // EMU degrees → actual degrees
    if (/flipH="1"/.test(spXml)) s.flipH = true;
    if (/flipV="1"/.test(spXml)) s.flipV = true;
    // Fill — solidColor or image fill
    // Extract spPr block to check fill properties in isolation (avoid matching noFill inside <a:ln>)
    const spPrBlock = spXml.match(/<p:spPr>([\s\S]*?)<\/p:spPr>/);
    const spPrXml = spPrBlock ? spPrBlock[1] : spXml;
    // Remove <a:ln>...</a:ln> from spPr to avoid false noFill matches in stroke
    const spPrNoLn = spPrXml.replace(/<a:ln\b[\s\S]*?<\/a:ln>/g, '');
    if (/<a:noFill\/>/.test(spPrNoLn)) {
        s.fill = null;
    } else {
        const sfBlock = spPrNoLn.match(/<a:solidFill>[\s\S]*?<\/a:solidFill>/);
        if (sfBlock) s.fill = resolveColor(sfBlock[0]);
        // Image fill (blipFill) inside shape
        const bfBlock = spPrNoLn.match(/<a:blipFill[\s\S]*?<\/a:blipFill>/);
        if (bfBlock) {
            const em = bfBlock[0].match(/r:embed="([^"]+)"/);
            if (em) s.imgFillId = em[1];
            // srcRect cropping for shape image fill
            const sr = bfBlock[0].match(/<a:srcRect([^>]*)\/>/);
            if (sr) {
                s.imgSrcRect = {
                    l: parseInt((sr[0].match(/l="(\d+)"/) || [0, '0'])[1]) / 100000,
                    t: parseInt((sr[0].match(/t="(\d+)"/) || [0, '0'])[1]) / 100000,
                    r: parseInt((sr[0].match(/r="(\d+)"/) || [0, '0'])[1]) / 100000,
                    b: parseInt((sr[0].match(/b="(\d+)"/) || [0, '0'])[1]) / 100000
                };
            }
        }
    }
    // useBgFill: inherit slide background (treat as no-fill transparency)
    if (/useBgFill="1"/.test(spXml)) s.fill = null;
    // Stroke
    const lnBlock = spXml.match(/<a:ln\b[\s\S]*?<\/a:ln>/);
    if (lnBlock && /<a:solidFill>/.test(lnBlock[0])) {
        const lnw = lnBlock[0].match(/w="(\d+)"/);
        s.stroke = { w: lnw ? parseInt(lnw[1]) : 12700 };
        s.stroke.color = resolveColor(lnBlock[0]);
    }
    // Text body
    const tb = spXml.match(/<p:txBody>([\s\S]*?)<\/p:txBody>/);
    if (tb) {
        s.texts = parseParagraphs(tb[1]);
        // Text vertical anchor
        const bp = tb[1].match(/<a:bodyPr[^>]*anchor="([^"]+)"/);
        if (bp) s.anchor = bp[1];  // ctr, t, b
    }
    return s;
}

// ── Picture parser ──
function parsePictureElement(picXml) {
    const p = { type: 'picture', name: '', x: 0, y: 0, w: 100, h: 50, embedId: null, srcRect: null, rot: 0, flipH: false, flipV: false };
    const nm = picXml.match(/<p:cNvPr[^>]*name="([^"]*)"/); if (nm) p.name = nm[1];
    const off = picXml.match(/<a:off[^>]*x="(\d+)"[^>]*y="(\d+)"/); if (off) { p.x = parseInt(off[1]); p.y = parseInt(off[2]); }
    const ext = picXml.match(/<a:ext[^>]*cx="(\d+)"[^>]*cy="(\d+)"/); if (ext) { p.w = parseInt(ext[1]); p.h = parseInt(ext[2]); }
    const em = picXml.match(/r:embed="([^"]+)"/); if (em) p.embedId = em[1];
    // Rotation & flip
    const rt = picXml.match(/rot="(\d+)"/); if (rt) p.rot = parseInt(rt[1]) / 60000;
    if (/flipH="1"/.test(picXml)) p.flipH = true;
    if (/flipV="1"/.test(picXml)) p.flipV = true;
    // Image cropping (srcRect)
    const sr = picXml.match(/<a:srcRect([^>]*)\/>/);
    if (sr) {
        p.srcRect = {
            l: parseInt((sr[0].match(/l="(\d+)"/) || [0, '0'])[1]) / 100000,
            t: parseInt((sr[0].match(/t="(\d+)"/) || [0, '0'])[1]) / 100000,
            r: parseInt((sr[0].match(/r="(\d+)"/) || [0, '0'])[1]) / 100000,
            b: parseInt((sr[0].match(/b="(\d+)"/) || [0, '0'])[1]) / 100000
        };
    }
    return p;
}

// ── Paragraph / text-run parser ──
function parseParagraphs(txBodyXml) {
    const paragraphs = [];
    const pRegex = /<a:p>([\s\S]*?)<\/a:p>/g; let pm;
    while ((pm = pRegex.exec(txBodyXml)) !== null) {
        const para = { runs: [], align: 'l' };
        const a = pm[1].match(/algn="([^"]+)"/); if (a) para.align = a[1];
        const rRegex = /<a:r>([\s\S]*?)<\/a:r>/g; let rm;
        while ((rm = rRegex.exec(pm[1])) !== null) {
            const rp = rm[1].match(/<a:rPr([^>]*?)(?:\/>|>[\s\S]*?<\/a:rPr>)/);
            const defaults = { sz: 1800, bold: false, italic: false, color: '#333333', font: 'sans-serif' };
            if (rp) {
                const r = rp[0];
                const szm = r.match(/sz="(\d+)"/); if (szm) defaults.sz = parseInt(szm[1]);
                if (/b="1"/.test(r) || /b="true"/.test(r)) defaults.bold = true;
                if (/i="1"/.test(r) || /i="true"/.test(r)) defaults.italic = true;
                const ea = r.match(/ea typeface="([^"]+)"/); if (ea) defaults.font = ea[1];
                else { const la = r.match(/latin typeface="([^"]+)"/); if (la) defaults.font = la[1]; }
                const sfBlock = r.match(/<a:solidFill>[\s\S]*?<\/a:solidFill>/);
                if (sfBlock) defaults.color = resolveColor(sfBlock[0]) || '#333333';
            }
            // Capture text segments and <a:br/> line breaks within the run
            // Split the run content by <a:br/> to handle soft line breaks
            const runXml = rm[1];
            const brSplit = runXml.split(/<a:br\b[^>]*\/>/);
            const segments = [];
            for (let bi = 0; bi < brSplit.length; bi++) {
                const tRegex = /<a:t[^>]*>([\s\S]*?)<\/a:t>/g; let tm;
                const tTexts = [];
                while ((tm = tRegex.exec(brSplit[bi])) !== null) {
                    tTexts.push(tm[1]);
                }
                if (tTexts.length > 0) {
                    segments.push(tTexts.join(''));
                }
                // Add newline between segments split by <a:br/>, but not after the last one
                if (bi < brSplit.length - 1) {
                    segments.push('\n');
                }
            }
            if (segments.length > 0) {
                const joined = segments.join('');
                if (joined.trim()) {
                    para.runs.push({ text: joined, ...defaults, sz: defaults.sz, bold: defaults.bold, italic: defaults.italic, color: defaults.color, font: defaults.font });
                }
            }
        }
        if (para.runs.length === 0) {
            // Fallback: text directly in paragraph without <a:r> wrapper (rare but valid)
            const tRegex2 = /<a:t[^>]*>([\s\S]*?)<\/a:t>/g; let t2;
            const directTexts = [];
            while ((t2 = tRegex2.exec(pm[1])) !== null) directTexts.push(t2[1]);
            if (directTexts.length > 0) {
                para.runs.push({ text: directTexts.join('\n'), sz: 1800, bold: false, italic: false, color: '#333333', font: 'sans-serif' });
            }
        }
        if (para.runs.length > 0) paragraphs.push(para);
    }
    return paragraphs;
}

// ── Slide-element tree parser (sp / pic / grpSp / graphicFrame / tbl in z-order) ──
function parseSlideElements(slideXml) {
    try {
        const elements = [];
        const st = slideXml.match(/<p:spTree>([\s\S]*?)<\/p:spTree>/);
        if (!st) return elements;
        const re = /<(p:sp|p:pic|p:grpSp|p:graphicFrame)\b([\s\S]*?)<\/\1>/g; let em;
        let idx = 0;
        while ((em = re.exec(st[1])) !== null) {
            const tag = em[1], xml = em[0];
            if (tag === 'p:sp') elements.push(parseShapeElement(xml));
            else if (tag === 'p:pic') elements.push(parsePictureElement(xml));
            else if (tag === 'p:grpSp') elements.push(...parseGroupElements(xml, 0));
            else if (tag === 'p:graphicFrame') {
                const tblXml = xml.match(/<a:tbl>([\s\S]*?)<\/a:tbl>/);
                if (tblXml) {
                    elements.push(...parseTableAsShapes(xml, tblXml[1]));
                } else {
                    const s = parseShapeElement(xml);
                    if (s.texts.length > 0) elements.push(s);
                }
            }
            idx++;
            if (idx > 5000) break; // Safety limit per slide
        }
        return elements;
    } catch (e) {
        console.warn('parseSlideElements error:', e.message);
        return [];
    }
}

function parseGroupElements(grpSpXml, depth) {
    if (depth === undefined) depth = 0;
    if (depth > 8) return []; // Prevent stack overflow from deeply nested groups
    const elts = [];
    const gOff = grpSpXml.match(/<a:off[^>]*x="(\d+)"[^>]*y="(\d+)"/);
    const gx = gOff ? parseInt(gOff[1]) : 0, gy = gOff ? parseInt(gOff[2]) : 0;
    const re = /<(p:sp|p:pic|p:grpSp|p:graphicFrame)\b([\s\S]*?)<\/\1>/g; let em;
    while ((em = re.exec(grpSpXml)) !== null) {
        const tag = em[1], xml = em[0];
        if (tag === 'p:grpSp') {
            try {
                const nested = parseGroupElements(xml, depth + 1);
                for (const el of nested) { el.x += gx; el.y += gy; elts.push(el); }
            } catch (e) {
                // Gracefully skip broken nested groups
                console.warn('Skipped nested group at depth', depth + 1, e.message);
            }
        } else if (tag === 'p:graphicFrame') {
            const tblXml = xml.match(/<a:tbl>([\s\S]*?)<\/a:tbl>/);
            if (tblXml) {
                const tblShapes = parseTableAsShapes(xml, tblXml[1]);
                for (const s of tblShapes) { s.x += gx; s.y += gy; elts.push(s); }
            } else {
                const s = parseShapeElement(xml);
                if (s && s.texts.length > 0) { s.x += gx; s.y += gy; elts.push(s); }
            }
        } else {
            let el = null;
            if (tag === 'p:sp') el = parseShapeElement(xml);
            else if (tag === 'p:pic') el = parsePictureElement(xml);
            if (el) { el.x += gx; el.y += gy; elts.push(el); }
        }
    }
    return elts;
}

// ── Table parser: extract table cells as positioned text shapes ──
function parseTableAsShapes(graphicFrameXml, tblXml) {
    const shapes = [];
    // Get graphicFrame position
    const gfOff = graphicFrameXml.match(/<a:off[^>]*x="(\d+)"[^>]*y="(\d+)"/);
    const gfExt = graphicFrameXml.match(/<a:ext[^>]*cx="(\d+)"[^>]*cy="(\d+)"/);
    const gfx = gfOff ? parseInt(gfOff[1]) : 0;
    const gfy = gfOff ? parseInt(gfOff[2]) : 0;

    // Collect all columns' widths
    const gridCol = [];
    const gcRegex = /<a:gridCol[^>]*w="(\d+)"/g; let gcm;
    while ((gcm = gcRegex.exec(tblXml)) !== null) {
        gridCol.push(parseInt(gcm[1]));
    }

    // Parse rows
    const trRegex = /<a:tr[^>]*h="(\d+)"[^>]*>([\s\S]*?)<\/a:tr>/g; let trm;
    let rowY = gfy;
    while ((trm = trRegex.exec(tblXml)) !== null) {
        const rowH = parseInt(trm[1]);
        // Parse cells
        const tcRegex = /<a:tc>([\s\S]*?)<\/a:tc>/g; let tcm;
        let colX = gfx;
        let colIdx = 0;
        while ((tcm = tcRegex.exec(trm[2])) !== null) {
            const tcXml = tcm[1];
            // Cell width from gridCol or defaults
            const cellW = colIdx < gridCol.length ? gridCol[colIdx] : 500000;

            // Extract text from cell
            const texts = parseParagraphs(tcXml);
            if (texts.length > 0) {
                const shape = {
                    type: 'shape',
                    name: 'table_cell',
                    x: colX, y: rowY,
                    w: cellW, h: rowH,
                    fill: null, stroke: null,
                    texts: texts,
                    geom: 'rect'
                };
                // Try to get cell fill
                const cfBlock = tcXml.match(/<a:solidFill>[\s\S]*?<\/a:solidFill>/);
                if (cfBlock) shape.fill = resolveColor(cfBlock[0]);
                shapes.push(shape);
            }
            colX += cellW;
            colIdx++;
        }
        rowY += rowH;
    }
    return shapes;
}

// ── Relationship resolver (relative-path aware) ──
function parsePptxRelsV2(relsXml, slideDir) {
    const map = {};
    const ms = relsXml.match(/<Relationship[^>]*\/>/g);
    if (!ms) return map;
    for (const m of ms) {
        const id = m.match(/Id="([^"]+)"/), tgt = m.match(/Target="([^"]+)"/);
        if (id && tgt) {
            let target = tgt[1];
            if (target.startsWith('../')) target = 'ppt/' + target.substring(3);
            else target = slideDir + '/' + target;
            map[id[1]] = target;
        }
    }
    return map;
}

function loadImage(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
    });
}

// ── Canvas rendering helpers ──
// ── Shape renderer with rotation, image fill, vertical text anchor ──
function renderShape(ctx, shape, sx, sy, fillImg) {
    const x = emuToPx(shape.x, sx), y = emuToPx(shape.y, sy);
    const w = emuToPx(shape.w, sx), h = emuToPx(shape.h, sy);
    if (w < 2 || h < 2) return;

    // Apply rotation & flip
    const cx = x + w / 2, cy = y + h / 2;
    const needsTransform = shape.rot !== 0 || shape.flipH || shape.flipV;
    if (needsTransform) {
        ctx.save();
        ctx.translate(cx, cy);
        if (shape.flipH) ctx.scale(-1, 1);
        if (shape.flipV) ctx.scale(1, -1);
        if (shape.rot !== 0) ctx.rotate(shape.rot * Math.PI / 180);
        ctx.translate(-cx, -cy);
    }

    // Define geometry path
    function geomPath() {
        if (shape.geom === 'ellipse') {
            ctx.beginPath(); ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
        } else if (shape.geom === 'roundRect') {
            const r = Math.min(w, h) * 0.08;
            ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
        } else {
            ctx.beginPath(); ctx.rect(x, y, w, h);
        }
    }

    // Fill — image or solid color
    if (fillImg) {
        // Image fill: clip to shape path, then draw image
        ctx.save();
        geomPath(); ctx.clip();
        ctx.drawImage(fillImg, x, y, w, h);
        ctx.restore();
    } else if (shape.fill) {
        ctx.fillStyle = shape.fill;
        geomPath(); ctx.fill();
    }

    // Stroke
    if (shape.stroke && shape.stroke.w > 0 && shape.stroke.color) {
        ctx.strokeStyle = shape.stroke.color;
        ctx.lineWidth = Math.max(1, emuToPx(shape.stroke.w, sx));
        geomPath(); ctx.stroke();
    }

    if (needsTransform) ctx.restore();

    // Text
    if (shape.texts.length > 0 && w > 20 && h > 14) {
        renderShapeText(ctx, shape, x, y, w, h);
    }
}

// ── Word wrap helper: split text into lines that fit within maxWidth ──
function wrapText(ctx, text, maxWidth) {
    if (!text || maxWidth <= 0) return [''];
    const lines = [];
    // Split by existing newlines first, then wrap each segment
    const segments = text.split('\n');
    for (let si = 0; si < segments.length; si++) {
        const segment = segments[si];
        if (!segment) {
            lines.push(''); // Preserve empty lines from \n\n
            continue;
        }
        // Try to fit as much as possible on each line
        let remaining = segment;
        while (remaining.length > 0) {
            // Binary search for the break point
            let low = 0, high = remaining.length;
            let best = 0;
            while (low <= high) {
                const mid = Math.floor((low + high) / 2);
                const substr = remaining.slice(0, mid);
                const width = ctx.measureText(substr).width;
                if (width <= maxWidth) {
                    best = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }
            // If best is 0 and remaining is non-empty, force at least 1 char
            if (best === 0 && remaining.length > 0) best = 1;
            // Try to break at a word boundary (space or CJK character)
            let breakAt = best;
            if (breakAt < remaining.length) {
                // Look backward for a good break point
                for (let i = breakAt; i > 0; i--) {
                    const ch = remaining[i - 1];
                    // Break after space, or before CJK punctuation, or at CJK char boundary
                    if (ch === ' ' || ch === '\u3000' ||  // Space / full-width space
                        (i < remaining.length && /[\u3001\u3002\uff0c\uff0e\uff1f\uff01]/.test(remaining[i]))) {
                        breakAt = i;
                        break;
                    }
                    // CJK characters can break anywhere
                    if (/[\u4e00-\u9fff]/.test(ch) && i < breakAt - 1) {
                        // Don't break in the middle of a Latin word
                        const nextCh = remaining[i];
                        if (/[a-zA-Z]/.test(nextCh)) continue;
                        breakAt = i;
                        break;
                    }
                }
            }
            lines.push(remaining.slice(0, breakAt));
            remaining = remaining.slice(breakAt).replace(/^\s+/, ''); // Trim leading spaces on continuation
        }
        // Add empty line marker between segments (except after last)
        if (si < segments.length - 1) {
            lines.push(''); // Will be rendered as an empty line
        }
    }
    return lines;
}

// ── Text renderer with vertical centering + word wrap ──
function renderShapeText(ctx, shape, ox, oy, ow, oh) {
    const pad = 8, maxW = ow - pad * 2;
    ctx.textBaseline = 'top';

    // First pass: wrap all text and calculate total height
    let totalH = 0;
    const wrappedLines = [];
    for (const para of shape.texts) {
        for (const run of para.runs) {
            if (!run.text.trim()) continue;
            const fs = Math.max(8, run.sz / 100);
            ctx.font = (run.italic ? 'italic ' : '') + (run.bold ? 'bold ' : '') + fs + 'px "' + run.font + '", "Microsoft YaHei", sans-serif';
            const lines = wrapText(ctx, run.text, maxW);
            for (const line of lines) {
                wrappedLines.push({ text: line, run, para, fs, h: fs * 1.35 });
                totalH += fs * 1.35;
            }
        }
        totalH += 4; // paragraph gap
    }
    // Remove trailing gap
    if (shape.texts.length > 0) totalH -= 4;

    // Vertical anchor: t=top, ctr=center, b=bottom
    let startY = oy + pad;
    if (shape.anchor === 'ctr') {
        startY = oy + (oh - totalH) / 2;
        if (startY < oy + pad) startY = oy + pad;
    } else if (shape.anchor === 'b') {
        startY = oy + oh - totalH - pad;
        if (startY < oy + pad) startY = oy + pad;
    }

    // Second pass: render wrapped lines
    let cy = startY;
    for (const { text, run, para, fs } of wrappedLines) {
        if (cy > oy + oh - 5) break;
        ctx.font = (run.italic ? 'italic ' : '') + (run.bold ? 'bold ' : '') + fs + 'px "' + run.font + '", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = run.color;
        if (!text) {
            cy += fs * 1.35; // Empty line
            continue;
        }
        let tx = ox + pad;
        const tw = ctx.measureText(text).width;
        if (para.align === 'ctr') tx = ox + (ow - tw) / 2;
        else if (para.align === 'r') tx = ox + ow - pad - tw;
        ctx.fillText(text, tx, cy, maxW);
        cy += fs * 1.35;
    }
}

// ── Picture renderer with srcRect cropping + rotation ──
function renderPictureOnCanvas(ctx, pic, img, sx, sy) {
    const x = emuToPx(pic.x, sx), y = emuToPx(pic.y, sy);
    const w = emuToPx(pic.w, sx), h = emuToPx(pic.h, sy);
    if (w < 2 || h < 2 || !img) return;

    // Apply rotation & flip
    const cx = x + w / 2, cy = y + h / 2;
    const needsTransform = pic.rot !== 0 || pic.flipH || pic.flipV;
    if (needsTransform) {
        ctx.save();
        ctx.translate(cx, cy);
        if (pic.flipH) ctx.scale(-1, 1);
        if (pic.flipV) ctx.scale(1, -1);
        if (pic.rot !== 0) ctx.rotate(pic.rot * Math.PI / 180);
        ctx.translate(-cx, -cy);
    }

    if (pic.srcRect) {
        // Cropped draw: source region from original image
        const sw = img.naturalWidth;
        const sh = img.naturalHeight;
        const sx2 = pic.srcRect.l * sw;
        const sy2 = pic.srcRect.t * sh;
        const sw2 = sw - (pic.srcRect.l + pic.srcRect.r) * sw;
        const sh2 = sh - (pic.srcRect.t + pic.srcRect.b) * sh;
        ctx.drawImage(img, sx2, sy2, sw2, sh2, x, y, w, h);
    } else {
        ctx.drawImage(img, x, y, w, h);
    }

    if (needsTransform) ctx.restore();
}

// ── Convenience: extract plain text from slide elements ──
function slideElementsToText(elements) {
    return elements
        .filter(el => el.type === 'shape')
        .flatMap(el => el.texts.flatMap(p => p.runs.map(r => r.text)))
        .filter(t => t.trim());
}

async function processPptToPdf() {
    setProgress(10, '解析演示文稿...');
    const file = selectedFiles[0];
    const L = uiLocales[currentLang];

    if (!file.name.toLowerCase().endsWith('.pptx')) {
        showToast(L.pptLegacyFallback, 'warn');
        // 旧 .ppt 格式：生成占位符 PDF
        const pdfDoc = await PDFLib.PDFDocument.create();
        const page = pdfDoc.addPage([595, 842]);
        const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        page.drawText('PPT to PDF Conversion', { x: 50, y: 780, font, size: 18, color: PDFLib.rgb(0.1, 0.1, 0.8) });
        page.drawText('Source File: ' + file.name, { x: 50, y: 740, font, size: 11, color: PDFLib.rgb(0.3, 0.3, 0.3) });
        page.drawText('Legacy .ppt format requires LibreOffice conversion.', { x: 50, y: 700, font, size: 9, color: PDFLib.rgb(0.5, 0.5, 0.5) });
        const bytes = await pdfDoc.save();
        download(new Blob([bytes], { type: 'application/pdf' }), getBaseName(file.name) + '_converted.pdf', 'application/pdf');
        return;
    }

    // Parse PPTX (ZIP-based) using JSZip
    const buf = await readFileAsArrayBuffer(file);
    const zip = await JSZip.loadAsync(buf);

    // Read slide dimensions from presentation.xml
    let slideSize = PPTX_SLIDE_DEFAULTS;
    if (zip.files['ppt/presentation.xml']) {
        const presXml = await zip.files['ppt/presentation.xml'].async('text');
        slideSize = parseSlideSize(presXml);
    }

    // Find all slides
    const slideFiles = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => {
        const na = parseInt(a.match(/slide(\d+)/)?.[1] || '0', 10);
        const nb = parseInt(b.match(/slide(\d+)/)?.[1] || '0', 10);
        return na - nb;
    });
    if (slideFiles.length === 0) {
        showToast('未找到幻灯片内容', 'warn');
        return;
    }

    const totalSlides = slideFiles.length;

    // Pre-load all media images (8 concurrent)
    setProgress(15, '加载媒体资源...');
    const mediaImages = {};
    const mediaFiles = Object.keys(zip.files).filter(f => /^ppt\/media\//.test(f));
    const MEDIA_BATCH = 8;
    for (let bi = 0; bi < mediaFiles.length; bi += MEDIA_BATCH) {
        const batch = mediaFiles.slice(bi, bi + MEDIA_BATCH);
        await Promise.all(batch.map(async (mf) => {
            try {
                const data = await zip.files[mf].async('uint8array');
                mediaImages[mf] = URL.createObjectURL(new Blob([data]));
            } catch (e) { /* skip broken */ }
        }));
    }

    // Pre-parse all slides
    setProgress(20, '解析幻灯片结构...');
    const slidePreData = await Promise.all(slideFiles.map(async (sf) => {
        const slideNum = sf.match(/slide(\d+)/)?.[1] ?? '0';
        const slideXml = await zip.files[sf].async('text');
        const elements = parseSlideElements(slideXml);
        const relsPath = sf.replace(/\.xml$/, '.xml.rels').replace('slides/', 'slides/_rels/');
        let imgMap = {};
        if (zip.files[relsPath]) {
            imgMap = parsePptxRelsV2(await zip.files[relsPath].async('text'), 'ppt/slides');
        }
        return { sf, slideNum, slideXml, elements, imgMap };
    }));

    // Create PDF document with slide aspect ratio
    const pdfDoc = await PDFLib.PDFDocument.create();

    // Calculate PDF page size (fit to standard width 595pt, maintain aspect ratio)
    const PDF_WIDTH = 595;
    const PDF_HEIGHT = Math.round(PDF_WIDTH * slideSize.cy / slideSize.cx);

    // Canvas dimensions for rendering (higher resolution for better quality)
    const canvasW = 1280;
    const canvasH = Math.round(canvasW * slideSize.cy / slideSize.cx);
    const scaleX = canvasW / slideSize.cx;
    const scaleY = canvasH / slideSize.cy;

    // Render slides and add to PDF (4 concurrent)
    const SLIDE_CONCURRENCY = 4;
    let slideCompleted = 0;

    for (let bi = 0; bi < totalSlides; bi += SLIDE_CONCURRENCY) {
        const bEnd = Math.min(bi + SLIDE_CONCURRENCY, totalSlides);
        const batchIndices = [];
        for (let j = bi; j < bEnd; j++) batchIndices.push(j);

        await Promise.all(batchIndices.map(async (i) => {
            const { slideXml, elements, imgMap } = slidePreData[i];

            // Create canvas for this slide
            const c = document.createElement('canvas');
            c.width = canvasW; c.height = canvasH;
            const cx = c.getContext('2d');

            // Render background
            let bgUrl = null;
            const bgBlock = slideXml.match(/<p:bg>([\s\S]*?)<\/p:bg>/);
            if (bgBlock) {
                const bgXml = bgBlock[1];
                const bgColor = resolveColor(bgXml);
                if (bgColor) { cx.fillStyle = bgColor; cx.fillRect(0, 0, canvasW, canvasH); }
                const bgBlip = bgXml.match(/r:embed="([^"]+)"/);
                if (bgBlip) { const bp = imgMap[bgBlip[1]]; if (bp && mediaImages[bp]) bgUrl = mediaImages[bp]; }
            }
            if (!bgUrl) {
                const layoutRId = imgMap['rId1'];
                if (layoutRId) {
                    const layoutFile = layoutRId.replace('ppt/slides/', '');
                    const lp = layoutFile.startsWith('..') ? 'ppt/' + layoutFile.substring(3) : layoutFile;
                    if (zip.files[lp]) {
                        const lx = await zip.files[lp].async('text');
                        const lbg = lx.match(/<p:bg>([\s\S]*?)<\/p:bg>/);
                        if (lbg) {
                            const lColor = resolveColor(lbg[1]);
                            if (lColor) { cx.fillStyle = lColor; cx.fillRect(0, 0, canvasW, canvasH); }
                            const lb = lbg[1].match(/r:embed="([^"]+)"/);
                            if (lb) {
                                const ld = lp.replace(/\/[^/]+$/, '');
                                const lrp = lp.replace(/\/([^/]+)$/, '/_rels/$1.rels');
                                if (zip.files[lrp]) {
                                    const lim = parsePptxRelsV2(await zip.files[lrp].async('text'), ld);
                                    const lbp = lim[lb[1]];
                                    if (lbp && mediaImages[lbp]) bgUrl = mediaImages[lbp];
                                }
                            }
                        }
                    }
                }
            }
            if (bgUrl) {
                try { const bi = await loadImage(bgUrl); cx.drawImage(bi, 0, 0, canvasW, canvasH); }
                catch (e) { cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, canvasW, canvasH); }
            } else if (!cx.fillStyle || cx.fillStyle === '#000000') {
                cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, canvasW, canvasH);
            }

            // Render elements in z-order
            for (const el of elements) {
                if (el.type === 'shape') {
                    let shapeImg = null;
                    if (el.imgFillId && imgMap[el.imgFillId] && mediaImages[imgMap[el.imgFillId]]) {
                        try { shapeImg = await loadImage(mediaImages[imgMap[el.imgFillId]]); }
                        catch (e) { /* skip broken */ }
                    }
                    renderShape(cx, el, scaleX, scaleY, shapeImg);
                } else if (el.type === 'picture') {
                    const ip = imgMap[el.embedId];
                    if (ip && mediaImages[ip]) {
                        try { const img = await loadImage(mediaImages[ip]); renderPictureOnCanvas(cx, el, img, scaleX, scaleY); }
                        catch (e) { /* skip */ }
                    }
                }
            }

            // Convert canvas to PNG and embed in PDF
            const pngData = c.toDataURL('image/png').split(',')[1];
            const pngImage = await pdfDoc.embedPng(pngData);
            const page = pdfDoc.addPage([PDF_WIDTH, PDF_HEIGHT]);
            page.drawImage(pngImage, {
                x: 0,
                y: 0,
                width: PDF_WIDTH,
                height: PDF_HEIGHT
            });
        }));

        slideCompleted += bEnd - bi;
        setProgress(25 + (slideCompleted / totalSlides * 70), `渲染第 ${slideCompleted}/${totalSlides} 张幻灯片...`);
    }

    // Cleanup
    for (const url of Object.values(mediaImages)) URL.revokeObjectURL(url);

    setProgress(98, '生成 PDF...');
    const bytes = await pdfDoc.save();
    download(new Blob([bytes], { type: 'application/pdf' }), getBaseName(file.name) + '_converted.pdf', 'application/pdf');
}

// ========================================================
// PROCESS: PDF TO WORD
// ========================================================
async function processPdfToWord() {
    await loadPdfJs();
    setProgress(20, '提取 PDF 文本...');
    const file = selectedFiles[0];
    const buf = await readFileAsArrayBuffer(file);
    const typedArray = new Uint8Array(buf);
    const pdf = await window.pdfjsLib.getDocument({ data: typedArray }).promise;

    let fullText = '';
    for (let p = 1; p <= pdf.numPages; p++) {
        setProgress(20 + (p / pdf.numPages * 60), `提取第 ${p}/${pdf.numPages} 页...`);
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(i => i.str).join(' ');
        fullText += `\n\n--- Page ${p} ---\n\n${pageText}`;
    }

    setProgress(85, '生成 Word 文档...');
    // 生成 RTF 格式（支持中文字符的 Unicode 编码）
    let rtfBody = '';
    for (let i = 0; i < fullText.length; i++) {
        const code = fullText.charCodeAt(i);
        if (code > 127) {
            // Unicode 转义: \uXXXX?
            rtfBody += '\\u' + code + '?';
        } else if (fullText[i] === '\\') {
            rtfBody += '\\\\';
        } else if (fullText[i] === '{') {
            rtfBody += '\\{';
        } else if (fullText[i] === '}') {
            rtfBody += '\\}';
        } else if (fullText[i] === '\n') {
            rtfBody += '\\par ';
        } else {
            rtfBody += fullText[i];
        }
    }
    const rtf = `{\\rtf1\\ansi\\ansicpg936\\deff0{\\fonttbl{\\f0\\fnil\\fcharset134\\fprq2 Microsoft YaHei;}}\\f0\\fs24${rtfBody}}`;
    const blob = new Blob([rtf], { type: 'application/rtf' });
    download(blob, getBaseName(file.name) + '_extracted.rtf', 'application/rtf');
    showToast('文本已提取为 RTF 格式（可用 Word 打开）', 'info');
}

// ========================================================
// PROCESS: PDF TO EXCEL
// ========================================================
async function processPdfToExcel() {
    await loadPdfJs();
    await loadXlsx();
    setProgress(20, '解析 PDF 表格...');
    const file = selectedFiles[0];
    const buf = await readFileAsArrayBuffer(file);
    const typedArray = new Uint8Array(buf);
    const pdf = await window.pdfjsLib.getDocument({ data: typedArray }).promise;

    const wb = XLSX.utils.book_new();
    for (let p = 1; p <= pdf.numPages; p++) {
        setProgress(20 + (p / pdf.numPages * 65), `分析第 ${p}/${pdf.numPages} 页...`);
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();
        // 按Y坐标分组（模拟行）
        const rowMap = {};
        textContent.items.forEach(item => {
            const y = Math.round(item.transform[5] / 10) * 10;
            if (!rowMap[y]) rowMap[y] = [];
            rowMap[y].push(item.str);
        });
        const rows = Object.keys(rowMap).sort((a, b) => b - a).map(y => rowMap[y]);
        const ws = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, `Page ${p}`);
    }

    setProgress(92, '生成 Excel...');
    XLSX.writeFile(wb, getBaseName(file.name) + '_extracted.xlsx');
}

// ========================================================
// PROCESS: PPT TO IMAGE (layout-aware PPTX renderer)
// ========================================================
async function processPptToImg() {
    setProgress(10, '解析演示文稿...');
    const file = selectedFiles[0];
    const L = uiLocales[currentLang];

    if (!file.name.toLowerCase().endsWith('.pptx')) {
        // Legacy .ppt binary format — can't parse in browser
        const canvas = document.createElement('canvas');
        canvas.width = 1280; canvas.height = 720;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 1280, 720);
        ctx.fillStyle = '#6366f1'; ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(L.pptLegacyFallback || 'Legacy .ppt requires LibreOffice', 640, 340);
        ctx.fillStyle = '#94a3b8'; ctx.font = '24px sans-serif';
        ctx.fillText(file.name, 640, 390);
        ctx.fillText(currentLang === 'zh' ? '请另存为 .pptx 格式后重试' : 'Please save as .pptx and retry', 640, 440);
        canvas.toBlob(blob => { download(blob, getBaseName(file.name) + '_preview.png', 'image/png'); }, 'image/png');
        showToast(L.pptLegacyFallback, 'warn');
        return;
    }

    // ── Open PPTX as ZIP ──
    const buf = await readFileAsArrayBuffer(file);
    const zip = await JSZip.loadAsync(buf);

    // ── Read slide dimensions from presentation.xml ──
    let slideSize = PPTX_SLIDE_DEFAULTS;
    if (zip.files['ppt/presentation.xml']) {
        const presXml = await zip.files['ppt/presentation.xml'].async('text');
        slideSize = parseSlideSize(presXml);
    }

    // ── Canvas dimensions (width=1280, maintain aspect ratio) ──
    const canvasW = 1280;
    const canvasH = Math.round(canvasW * slideSize.cy / slideSize.cx);
    const scaleX = canvasW / slideSize.cx;
    const scaleY = canvasH / slideSize.cy;

    // ── Find all slides ──
    const slideFiles = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => {
        const na = parseInt(a.match(/slide(\d+)/)?.[1] || '0', 10);
        const nb = parseInt(b.match(/slide(\d+)/)?.[1] || '0', 10);
        return na - nb;
    });
    if (slideFiles.length === 0) { showToast('未找到幻灯片内容', 'warn'); return; }
    const totalSlides = slideFiles.length;

    // ── Pre-load all media images (8 concurrent) ──
    setProgress(15, '加载媒体资源...');
    const mediaImages = {};
    const mediaFiles = Object.keys(zip.files).filter(f => /^ppt\/media\//.test(f));
    const MEDIA_BATCH = 8;
    for (let bi = 0; bi < mediaFiles.length; bi += MEDIA_BATCH) {
        const batch = mediaFiles.slice(bi, bi + MEDIA_BATCH);
        await Promise.all(batch.map(async (mf) => {
            try {
                const data = await zip.files[mf].async('uint8array');
                mediaImages[mf] = URL.createObjectURL(new Blob([data]));
            } catch (e) { /* skip broken */ }
        }));
    }

    // ── Phase 2: Pre-parse all slides in parallel ──
    setProgress(95, '解析幻灯片结构...');
    const slidePreData = await Promise.all(slideFiles.map(async (sf) => {
        const slideNum = sf.match(/slide(\d+)/)?.[1] ?? '0';
        const slideXml = await zip.files[sf].async('text');
        const elements = parseSlideElements(slideXml);
        const relsPath = sf.replace(/\.xml$/, '.xml.rels').replace('slides/', 'slides/_rels/');
        let imgMap = {};
        if (zip.files[relsPath]) {
            imgMap = parsePptxRelsV2(await zip.files[relsPath].async('text'), 'ppt/slides');
        }
        return { sf, slideNum, slideXml, elements, imgMap };
    }));

    // ── Phase 3: Render slides concurrently (4 at a time) ──
    const SLIDE_CONCURRENCY = 4;
    const slideBlobs = new Array(totalSlides);
    let slideCompleted = 0;

    for (let bi = 0; bi < totalSlides; bi += SLIDE_CONCURRENCY) {
        const bEnd = Math.min(bi + SLIDE_CONCURRENCY, totalSlides);
        const batchIndices = [];
        for (let j = bi; j < bEnd; j++) batchIndices.push(j);

        await Promise.all(batchIndices.map(async (i) => {
            const { sf, slideNum, slideXml, elements, imgMap } = slidePreData[i];

            // Each slide gets its own canvas for parallel rendering
            const c = document.createElement('canvas');
            c.width = canvasW; c.height = canvasH;
            const cx = c.getContext('2d');

            // ── Background ──
            let bgUrl = null;
            const bgBlock = slideXml.match(/<p:bg>([\s\S]*?)<\/p:bg>/);
            if (bgBlock) {
                const bgXml = bgBlock[1];
                const bgColor = resolveColor(bgXml);
                if (bgColor) { cx.fillStyle = bgColor; cx.fillRect(0, 0, canvasW, canvasH); }
                const bgBlip = bgXml.match(/r:embed="([^"]+)"/);
                if (bgBlip) { const bp = imgMap[bgBlip[1]]; if (bp && mediaImages[bp]) bgUrl = mediaImages[bp]; }
            }
            if (!bgUrl) {
                const layoutRId = imgMap['rId1'];
                if (layoutRId) {
                    const layoutFile = layoutRId.replace('ppt/slides/', '');
                    const lp = layoutFile.startsWith('..') ? 'ppt/' + layoutFile.substring(3) : layoutFile;
                    if (zip.files[lp]) {
                        const lx = await zip.files[lp].async('text');
                        const lbg = lx.match(/<p:bg>([\s\S]*?)<\/p:bg>/);
                        if (lbg) {
                            const lColor = resolveColor(lbg[1]);
                            if (lColor) { cx.fillStyle = lColor; cx.fillRect(0, 0, canvasW, canvasH); }
                            const lb = lbg[1].match(/r:embed="([^"]+)"/);
                            if (lb) {
                                const ld = lp.replace(/\/[^/]+$/, '');
                                const lrp = lp.replace(/\/([^/]+)$/, '/_rels/$1.rels');
                                if (zip.files[lrp]) {
                                    const lim = parsePptxRelsV2(await zip.files[lrp].async('text'), ld);
                                    const lbp = lim[lb[1]];
                                    if (lbp && mediaImages[lbp]) bgUrl = mediaImages[lbp];
                                }
                            }
                        }
                    }
                }
            }
            if (bgUrl) {
                try { const bi = await loadImage(bgUrl); cx.drawImage(bi, 0, 0, canvasW, canvasH); }
                catch (e) { cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, canvasW, canvasH); }
            } else if (!cx.fillStyle || cx.fillStyle === '#000000') {
                cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, canvasW, canvasH);
            }

            // ── Render elements in z-order ──
            for (const el of elements) {
                if (el.type === 'shape') {
                    // Resolve image fill for shapes (blipFill)
                    let shapeImg = null;
                    if (el.imgFillId && imgMap[el.imgFillId] && mediaImages[imgMap[el.imgFillId]]) {
                        try { shapeImg = await loadImage(mediaImages[imgMap[el.imgFillId]]); }
                        catch (e) { /* skip broken */ }
                    }
                    renderShape(cx, el, scaleX, scaleY, shapeImg);
                } else if (el.type === 'picture') {
                    const ip = imgMap[el.embedId];
                    if (ip && mediaImages[ip]) {
                        try { const img = await loadImage(mediaImages[ip]); renderPictureOnCanvas(cx, el, img, scaleX, scaleY); }
                        catch (e) { /* skip */ }
                    }
                }
            }

            const blob = await new Promise(r => c.toBlob(r, 'image/png'));
            const suffix = totalSlides > 1 ? `_slide${String(slideNum).padStart(2, '0')}` : '';
            slideBlobs[i] = { blob, name: `${getBaseName(file.name)}${suffix}.png` };
        }));

        slideCompleted += bEnd - bi;
        const pct = 18 + (slideCompleted / totalSlides * 74);
        setProgress(pct, `渲染 ${slideCompleted}/${totalSlides} 张幻灯片...`);
    }

    // ── Cleanup ──
    for (const url of Object.values(mediaImages)) URL.revokeObjectURL(url);

    // ── Deliver ──
    if (totalSlides === 1) {
        download(slideBlobs[0].blob, slideBlobs[0].name, 'image/png');
    } else {
        setProgress(93, '打包为 ZIP...');
        const outZip = new JSZip();
        for (const { blob, name } of slideBlobs) outZip.file(name, blob);
        const zipBlob = await outZip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
        download(zipBlob, getBaseName(file.name) + '_slides.zip', 'application/zip');
        showToast(`共 ${totalSlides} 张幻灯片，已打包为 ZIP 一次性下载`, 'info');
    }
}

// ========================================================
// HTML → PDF RENDERER (browser native print-to-PDF)
// ========================================================
function renderHtmlToPdf(htmlContent, filename) {
    return new Promise((resolve) => {
        const L = uiLocales[currentLang];
        showToast(currentLang === 'zh'
            ? '已打开打印预览，请在打印对话框中选择"另存为 PDF"保存'
            : 'Print preview opened. Choose "Save as PDF" in the print dialog.', 'info');

        const w = window.open('', '_blank', 'width=900,height=700');
        if (!w) {
            showToast('弹窗被拦截，请允许此网站的弹窗后重试', 'warn');
            resolve();
            return;
        }
        w.document.write(`<!DOCTYPE html><html><head>
            <meta charset="UTF-8">
            <style>
                @page{size:A4;margin:20mm}
                body{margin:20mm;font-family:"Microsoft YaHei","SimHei","PingFang SC",sans-serif;font-size:12px;line-height:1.7;color:#222}
                table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:4px 8px}
                th{background:#f0f4ff;font-weight:600;text-align:left}
                h3{margin:16px 0 8px}
            </style></head><body>${htmlContent}</body></html>`);
        w.document.close();
        w.focus();

        // Wait for content to render, then trigger print
        setTimeout(() => {
            // Register before w.print() so it catches the dialog close event
            w.addEventListener('afterprint', () => {
                w.close();
                resolve();
            }, { once: true });
            // Fallback: close after 60s regardless
            setTimeout(() => { try { w.close(); } catch(e) {} resolve(); }, 60000);
            w.print();
        }, 800);
    });
}

// ========================================================
// LAZY LOADERS
// ========================================================
function loadScript(src, globalCheck) {
    return new Promise((resolve, reject) => {
        if (window[globalCheck]) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
    });
}

async function loadPdfJs() {
    await loadScript('https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js', 'pdfjsLib');
    if (window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
}

async function loadMammoth() {
    await loadScript('https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js', 'mammoth');
}

async function loadXlsx() {
    await loadScript('https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js', 'XLSX');
}

// DRAG & DROP
// ========================================================
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('drop-highlight'); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); });
dropZone.addEventListener('dragleave', e => { if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drop-highlight'); });
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drop-highlight');
    if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', e => {
    if (e.target.files.length > 0) {
        handleFiles(e.target.files);
        e.target.value = '';
    }
});

// ========================================================
// MESSAGE / FEEDBACK SYSTEM
// ========================================================
// ========================================================
// MESSAGE / FEEDBACK SYSTEM (Server-side API)
// ========================================================
const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:3000'
    : '';  // 生产环境使用相对路径

let cachedMessages = [];
let isLoadingMessages = false;

function setLoading(loading) {
    isLoadingMessages = loading;
    const el = document.getElementById('msg-loading');
    if (el) el.classList.toggle('hidden', !loading);
}

// 从服务器加载留言
async function loadMessagesFromServer() {
    const L = uiLocales[currentLang];
    setLoading(true);

    try {
        const response = await fetch(`${API_BASE_URL}/api/messages`);
        if (!response.ok) throw new Error('Failed to load messages');

        const data = await response.json();
        cachedMessages = data.messages || [];
        renderMessageList();
    } catch (err) {
        console.error('Error loading messages:', err);
        showToast(L.msgLoadError, 'error');
    } finally {
        setLoading(false);
    }
}

// 提交新留言到服务器
async function submitMessage() {
    const L = uiLocales[currentLang];
    const nameInput = document.getElementById('msg-name');
    const contentInput = document.getElementById('txt-msg-content');

    const name = nameInput.value.trim();
    const content = contentInput.value.trim();

    if (!name || !content) {
        showToast(currentLang === 'zh' ? '请填写昵称和留言内容' : 'Please fill in name and message', 'warn');
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/api/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, content })
        });

        if (!response.ok) throw new Error('Failed to post message');

        const result = await response.json();
        if (result.success) {
            nameInput.value = '';
            contentInput.value = '';
            await loadMessagesFromServer();
            showToast(currentLang === 'zh' ? '留言发布成功！' : 'Message posted!', 'success');
        }
    } catch (err) {
        console.error('Error posting message:', err);
        showToast(L.msgPostError, 'error');
    }
}

// 从服务器删除留言
async function deleteMessage(msgId) {
    const L = uiLocales[currentLang];
    if (!confirm(currentLang === 'zh' ? '确定删除这条留言吗？' : 'Delete this message?')) return;

    try {
        const response = await fetch(`${API_BASE_URL}/api/messages/${msgId}`, {
            method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete message');

        await loadMessagesFromServer();
        showToast(currentLang === 'zh' ? '删除成功' : 'Deleted successfully', 'success');
    } catch (err) {
        console.error('Error deleting message:', err);
        showToast(L.msgPostError, 'error');
    }
}

function toggleReplyForm(msgId) {
    const form = document.getElementById(`reply-form-${msgId}`);
    if (form) {
        form.classList.toggle('hidden');
        if (!form.classList.contains('hidden')) {
            const input = document.getElementById(`reply-input-${msgId}`);
            if (input) input.focus();
        }
    }
}

// 提交回复到服务器
async function submitReply(msgId) {
    const L = uiLocales[currentLang];
    const input = document.getElementById(`reply-input-${msgId}`);
    const nameInput = document.getElementById(`reply-name-${msgId}`);

    const content = input.value.trim();
    const name = nameInput.value.trim() || (currentLang === 'zh' ? '匿名' : 'Anonymous');

    if (!content) {
        showToast(currentLang === 'zh' ? '请填写回复内容' : 'Please fill in reply content', 'warn');
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/api/messages/${msgId}/replies`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, content })
        });

        if (!response.ok) throw new Error('Failed to post reply');

        const result = await response.json();
        if (result.success) {
            await loadMessagesFromServer();
            showToast(currentLang === 'zh' ? '回复发布成功！' : 'Reply posted!', 'success');
        }
    } catch (err) {
        console.error('Error posting reply:', err);
        showToast(L.msgPostError, 'error');
    }
}

function formatTime(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diff = now - date;

    if (diff < 3600000) {
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return currentLang === 'zh' ? '刚刚' : 'Just now';
        return currentLang === 'zh' ? `${mins}分钟前` : `${mins}m ago`;
    }
    if (diff < 86400000) {
        const hours = Math.floor(diff / 3600000);
        return currentLang === 'zh' ? `${hours}小时前` : `${hours}h ago`;
    }
    return date.toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US', { month: 'short', day: 'numeric' });
}

function renderMessageList() {
    const L = uiLocales[currentLang];
    const container = document.getElementById('message-list');
    if (!container) return;

    const messages = cachedMessages;

    if (messages.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">${L.msgNoMessages}</div>`;
        return;
    }

    container.innerHTML = messages.map(msg => {
        const hasReplies = msg.replies && msg.replies.length > 0;
        const replyCount = hasReplies ? msg.replies.length : 0;

        const repliesHtml = hasReplies ? msg.replies.map(reply => `
            <div class="bg-slate-50/50 rounded-lg p-2.5 mt-2 border border-slate-100">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-semibold text-slate-700">${escapeHtml(reply.name)}</span>
                    <span class="text-[10px] text-slate-400">${formatTime(reply.timestamp)}</span>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(reply.content)}</p>
            </div>
        `).join('') : '';

        return `
        <div class="bg-white border border-slate-200/60 rounded-xl p-4 shadow-sm" data-msg-id="${msg.id}">
            <div class="flex items-start justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-slate-950 flex items-center justify-center text-white text-xs font-bold" title="LitePDF">
                        L
                    </div>
                    <div>
                        <div class="text-xs font-semibold text-slate-800">${escapeHtml(msg.name)}</div>
                        <div class="text-[10px] text-slate-400">${formatTime(msg.timestamp)}</div>
                    </div>
                </div>
                <button onclick="deleteMessage('${msg.id}')" class="text-[10px] text-slate-400 hover:text-rose-500 transition-colors" title="${L.msgDelete}">✕</button>
            </div>
            <p class="text-xs text-slate-700 leading-relaxed mb-3">${escapeHtml(msg.content)}</p>

            ${repliesHtml}

            <div class="flex items-center gap-3 mt-3 pt-2 border-t border-slate-100">
                <button onclick="toggleReplyForm('${msg.id}')" class="text-[11px] text-indigo-600 hover:text-indigo-700 font-medium transition-colors">
                    ${L.msgReply}${replyCount > 0 ? ` (${replyCount})` : ''}
                </button>
            </div>

            <div id="reply-form-${msg.id}" class="hidden mt-3 pt-3 border-t border-slate-100">
                <div class="space-y-2">
                    <input type="text" id="reply-name-${msg.id}" placeholder="${L.msgName}" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 bg-white" />
                    <textarea id="reply-input-${msg.id}" rows="2" placeholder="${L.msgReplyPlaceholder}" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 bg-white resize-none"></textarea>
                    <div class="flex gap-2">
                        <button onclick="submitReply('${msg.id}')" class="flex-1 bg-indigo-600 text-white text-xs py-1.5 rounded-lg hover:bg-indigo-700 transition-colors">${L.msgSubmitReply}</button>
                        <button onclick="toggleReplyForm('${msg.id}')" class="px-3 py-1.5 text-xs text-slate-500 hover:text-slate-700 transition-colors">取消</button>
                    </div>
                </div>
            </div>
        </div>
        `;
    }).join('');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function handleMessageSubmit(event) {
    event.preventDefault();
    submitMessage();
}
