version: '3.8'

services:
  litepdf:
    build: .
    container_name: litepdf
    ports:
      - "8088:80"      # 前端页面访问端口
      - "3000:3000"    # 留言后端 API 端口
    volumes:
      - ./data:/app/data  # 持久化留言数据到本地 data 目录
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: litepdf-ocr
    ports:
      - "5000:5000"    # OCR 后端 API 端口
    # 增加共享内存和内存限制，避免 paddle C++ 后端 double free
    shm_size: '2gb'
    mem_limit: '4g'
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
